      // Applica il tema salvato PRIMA che React monti — altrimenti si vedrebbe un
      // lampo del tema scuro di default a ogni refresh per chi ha scelto il chiaro.

        try {
          var t = localStorage.getItem('platform_theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
