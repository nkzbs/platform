events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # client_max_body_size (2026-09-06) — bug reale: il default di nginx
    # (1MB) bloccava con un 413 (corpo vuoto, MAI arrivato a Express) il
    # salvataggio di una pagina Sito Web con più foto incorporate come
    # data:URI — express.json({limit:'5mb'}) da solo non basta, nginx sta
    # DAVANTI e respinge prima. Stesso 5mb del limite Express, così i due
    # livelli sono d'accordo.
    client_max_body_size 5m;

    # Bug reale trovato 2026-09-02 (super-admin/frontend, stesso schema qui):
    # nessun Cache-Control -> il browser poteva servire un index.html vecchio
    # (bundle JS referenziato ormai rimosso dal server) per ore dopo un
    # redeploy riuscito. index.html sempre rivalidato; /assets/ è content-hashed
    # da Vite quindi cache-abile in modo aggressivo senza rischio.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Root del dominio (2026-09-04, richiesto dall'utente: "frontend è il sito") —
    # SOLO la root esatta ("location =", non un prefisso): ogni altro percorso
    # (deep-link della SPA, /app, ecc.) continua a passare dal blocco "location /"
    # sotto, invariato. Se il tenant ha il Sito Web attivo prova prima quello
    # (backend, /__root_public); se risponde 404 (sito non attivo o senza una
    # home pubblicata) nginx intercetta l'errore e serve comunque l'index.html
    # della SPA — zero cambiamento per un tenant che non ha mai attivato questa
    # funzionalità.
    location = / {
      proxy_pass http://127.0.0.1:3000/__root_public;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_intercept_errors on;
      error_page 404 = @spa_root;
    }
    location @spa_root {
      try_files /index.html =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Timeout esteso (2026-09-08) — stesso identico difetto già corretto in
      # super-admin/frontend/nginx.conf (bump a 150s, "Unexpected token '<'"
      # perché nginx restituiva la propria pagina HTML di errore invece della
      # risposta JSON del backend), ma mai in QUESTO nginx: quello dentro
      # l'immagine platform-core stessa, attraversato dalle chiamate interne
      # container-a-container di super-admin-backend verso il tenant appena
      # creato (tenant-api-client.js, es. POST /api/modules/internal/
      # install-batch durante il provisioning) — non solo dal browser verso
      # Super Admin. Trovato dal vivo (2026-09-08): un tenant reale ("nika")
      # fermo a provisioning_step "seeding_database" con lo stesso identico
      # errore, sulla NAS sotto pressione con più container in avvio insieme.
      proxy_read_timeout 150s;
      proxy_connect_timeout 150s;
    }

    # Sito Web pubblico (2026-09-04) — stesso pattern del blocco /api sopra, prefisso
    # diverso: pagine rese lato server dal backend (core/backend/src/routes/site.js),
    # mai la SPA React (deve restare leggibile da un crawler senza eseguire JS).
    location /negozio {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
