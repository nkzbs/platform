events {
  worker_connections 1024;
}

http {
  # Bucket size di default (64) basta solo per poche decine di domini corti —
  # superata quella soglia (successo reale 2026-08-30, passati da 8 a 15 tenant
  # demo, mappa a 19 voci) nginx rifiuta la nuova config al reload ("could not
  # build map_hash, you should increase map_hash_bucket_size") e RESTA sulla
  # config precedente, senza errori visibili al chiamante (reloadNginx()
  # riporta comunque {ok:true} — il fallimento è tutto interno a nginx). I
  # domini aggiunti dopo quel punto non vengono mai serviti finché non si nota
  # il problema. 512 copre comodamente centinaia di tenant con margine.
  map_hash_bucket_size 512;

  # Mappa dinamica dominio -> container tenant (platform-<slug>:80), rigenerata
  # automaticamente dal Super Admin backend ad ogni creazione/eliminazione tenant,
  # cambio dominio, stop/start, blocco/sblocco licenza — vedi
  # super-admin/backend/src/nginx-domain-sync.js. Se un host non è in mappa,
  # $tenant_upstream resta stringa vuota e la richiesta cade nel fallback Super Admin
  # qui sotto (comportamento identico a oggi per chi accede via IP o localhost).
  include /etc/nginx/tenants-map.conf;

  # I nomi dei container tenant sono risolti dal DNS interno di Docker (127.0.0.11).
  # Necessario perché qui sotto proxy_pass usa una variabile ($tenant_upstream), non
  # un nome fisso: con una variabile nginx NON risolve una volta sola all'avvio come
  # farebbe con un upstream statico, ma ad ogni richiesta — serve quindi un resolver
  # esplicito, altrimenti nginx non parte.
  resolver 127.0.0.11 valid=10s;

  # Bug reale trovato dal vivo (2026-10-31, segnalato dall'utente: "Errore nel
  # caricamento" su un upload di foto profilo) — QUESTO nginx è il PRIMO hop di
  # ogni richiesta (Cloudflare → qui → il nginx/backend del tenant), e non aveva
  # MAI un client_max_body_size proprio: restava sul default di nginx, 1MB.
  # core/nginx.conf (il nginx DENTRO ogni container tenant) l'aveva già corretto
  # il 2026-09-06 per lo stesso identico sintomo sul Sito Web — ma quel fix è a
  # valle: una richiesta sopra 1MB veniva già respinta QUI, prima ancora di
  # raggiungere il tenant, qualunque fosse il limite impostato più sotto. Stesso
  # limite di uploads.js (MAX_SIZE, il più alto usato in app) così questo primo
  # hop non è mai il più stretto della catena.
  client_max_body_size 20m;

  # TLS aggiunto il 26/10/2026 (richiesto dall'utente: passaggio da Cloudflare
  # "Flexible" a "Full (strict)" — il traffico tra Cloudflare e il NAS viaggiava
  # in chiaro). Certificato Origin CA di Cloudflare (valido 15 anni,
  # *.platform-core.it + platform-core.it), generato dalla dashboard Cloudflare.
  #
  # La porta 80 (mappata su 4000, quella che il router inoltra ed è l'unica
  # che Cloudflare raggiunge davvero) ascolta QUI in TLS, non in chiaro: scoperto
  # che una Origin Rule della zona (creata 2026-08-04, "Cambia porta [Modello]")
  # riscrive la destinazione a porta 4000 per OGNI richiesta indipendentemente dal
  # protocollo — quindi al passaggio Flexible→Full(strict) Cloudflare continua a
  # colpire la stessa porta 4000, solo cifrata. Nginx non può ascoltare in chiaro
  # e in TLS sulla stessa porta insieme: questo cambio e il passaggio a Full
  # (strict) nella dashboard Cloudflare vanno fatti nello stesso momento, altrimenti
  # c'è una finestra di disservizio per tutti i tenant + Super Admin.
  server {
    listen 80 ssl;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    server_name _;

    # Se l'Host header corrisponde a un dominio tenant noto e attivo, tutta la
    # richiesta va al container di quel tenant (che gestisce da solo / e /api
    # internamente, via il suo nginx+supervisord — vedi core/nginx.conf).
    #
    # Fix sicurezza (2026-08-07): PRIMA, qualunque host NON riconosciuto (IP nudo,
    # dominio apice senza sottodominio, qualunque scansione automatica) cadeva
    # comunque su Super Admin — questa porta è forwardata dal router per l'intera
    # fascia 4000-4100, quindi Super Admin era raggiungibile da chiunque su
    # internet in HTTP semplice, bypassando del tutto Cloudflare (HTTPS, WAF).
    # Super Admin risponde su un sottodominio vero dietro Cloudflare
    # (admin.platform-core.it, stessa regola Origin già usata da ogni tenant)
    # o in locale (localhost/127.0.0.1, mai esposto fuori dalla macchina di
    # sviluppo).
    #
    # Semplificazione 2026-09-27: Platform torna a essere un side project a
    # uso personale — rimossi Partner Portal e federazione (vedi App.jsx),
    # quindi anche core.platform-core.it, partner-admin.platform-core.it e il
    # pattern <slug>-partner.platform-core.it spariscono: esistevano solo per
    # lo split Core/Partner, oggi un solo host per il pannello,
    # admin.platform-core.it. Un tenant resta comunque raggiungibile sul
    # proprio dominio dedicato (<slug-tenant>.platform-core.it), invariato.
    #
    # NOTA (2026-09-12, ancora valida): un host non riconosciuto NON riceve
    # 444 — cade nel fallback super-admin-frontend più sotto. Segnalato a
    # parte, non corretto qui (è una scelta di sicurezza, non di dominio).
    location / {
      # X-Real-IP qui, PRIMA di ogni if (mancava prima del rate limiting lato
      # Express, 2026-08-10): senza, ogni richiesta arriva al backend del
      # tenant con l'IP INTERNO di questo container nginx, sempre lo stesso
      # per chiunque — un limitatore per-IP scambierebbe ogni utente reale per
      # lo stesso, condividendo la stessa quota tra tutti (login di due
      # persone diverse nello stesso minuto avrebbe bloccato la terza). Deve
      # stare FUORI dai blocchi if sotto: proxy_set_header non è permesso
      # dentro un if in questo contesto (nginx lo rifiuta a avvio), ma
      # impostato qui si applica comunque a qualunque proxy_pass scelto più
      # sotto, in entrambi i rami. Vedi shared/rate-limit.js.
      proxy_set_header X-Real-IP $remote_addr;
      if ($tenant_upstream != "") {
        proxy_pass http://$tenant_upstream;
        break;
      }
      if ($host !~* ^(admin\.platform-core\.it|localhost|127\.0\.0\.1)$) {
        return 444;
      }
      proxy_pass http://super-admin-frontend:80;
      proxy_set_header Host $host;
    }

    location /api {
      # 150s, non il default 60s (2026-09-11, bug reale trovato dal vivo:
      # "Unexpected token '<'... is not valid JSON" durante Super Builder/
      # creazione tenant — stesso identico sintomo già corretto due volte
      # stasera su ALTRI due nginx (super-admin/frontend/nginx.conf,
      # core/nginx.conf), ma non su QUESTO: platform-nginx è il PRIMO hop del
      # traffico reale (browser → questo → super-admin-frontend/tenant → ...),
      # il suo timeout di default tagliava la connessione PRIMA che i fix già
      # fatti più a valle potessero avere effetto — l'operazione finiva
      # comunque con successo sul server, ma il client vedeva la pagina di
      # errore HTML di QUESTO nginx invece della risposta JSON reale.
      proxy_read_timeout 150s;
      proxy_connect_timeout 150s;
      proxy_set_header X-Real-IP $remote_addr;
      if ($tenant_upstream != "") {
        proxy_pass http://$tenant_upstream;
        break;
      }
      if ($host !~* ^(admin\.platform-core\.it|localhost|127\.0\.0\.1)$) {
        return 444;
      }
      proxy_pass http://super-admin-backend:3000;
      proxy_set_header Host $host;
    }
  }
}
