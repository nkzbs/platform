server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Bug reale trovato 2026-09-02: nessun Cache-Control qui -> il browser poteva
  # continuare a servire un index.html vecchio (che referenzia un bundle JS
  # ormai rimosso dal server) per ore dopo un redeploy riuscito, con un fix
  # già live che sembrava non funzionare. index.html sempre rivalidato; i file
  # sotto /assets/ sono content-hashed da Vite (nome cambia se il contenuto
  # cambia) quindi possono essere cache-ati aggressivamente senza rischio.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /api {
    proxy_pass http://super-admin-backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 150s, non il default 60s (2026-09-08, bug reale trovato dal vivo
    # dall'utente: "Unexpected token '<'... is not valid JSON" dopo 5
    # creazioni tenant fallite) — la creazione di un tenant hosted non è
    # solo l'attesa del DB (waitForTenantDb, tenants.js, già alzata a 45s
    # per lo stesso motivo): sulla stessa richiesta HTTP si sommano anche
    # installazione moduli, applyAnalysisConfigToTenant e l'eventuale
    # chiamata DNS a Cloudflare — sotto il carico di memoria reale della
    # NAS (G20) il totale può superare i 60s di default. Quando succede,
    # nginx interrompe la connessione e restituisce la SUA pagina HTML di
    # errore al posto della risposta JSON del backend (che nel frattempo
    # può anche essere finita con successo) — da qui il parse error
    # invece di un messaggio comprensibile. Scoped a QUESTO container
    # (solo /api di super-admin-frontend), non al nginx condiviso che
    # instrada il traffico dei tenant — nessun altro percorso ne risente.
    proxy_read_timeout 150s;
    proxy_connect_timeout 150s;
  }
}
