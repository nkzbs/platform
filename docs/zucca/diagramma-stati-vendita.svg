<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1160" viewBox="0 0 680 580" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Vendita su zucca: come funziona</title>
<desc>Gli stati di cliente, immobile, trattativa e provvigione. Al passaggio a Rogito completato nascono da sole le due provvigioni.</desc>
<defs>
<style>
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.cap{font-size:12px;fill:#5F5E5A;font-weight:bold}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.gray .th{fill:#444441}
.gray .ts{fill:#5F5E5A}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.purple .th{fill:#3C3489}
.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.teal .th{fill:#085041}
.teal .ts{fill:#0F6E56}
</style>
<marker id="frecciaGrigia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="frecciaVerde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="580" fill="#FFFFFF"/>
<text x="42" y="34" font-size="20" font-weight="bold" fill="#2C2C2A">Vendita su zucca: come funziona</text>
<text class="ts" x="42" y="54">Gli stati di ogni scheda e cosa succede da solo</text>
<g transform="translate(0,64)">
<text class="cap" x="42" y="34">Cliente</text>
<g class="gray"><rect x="42" y="44" width="125" height="44" rx="8"/><text class="th" x="104" y="66" text-anchor="middle" dominant-baseline="central">Da verificare</text></g>
<line x1="167" y1="66" x2="197" y2="66" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="199" y="44" width="125" height="44" rx="8"/><text class="th" x="261" y="66" text-anchor="middle" dominant-baseline="central">Verificato</text></g>
<text class="ts" x="350" y="66" dominant-baseline="central">consenso alle comunicazioni accanto ai contatti</text>

<text class="cap" x="42" y="114">Immobile</text>
<g class="gray"><rect x="42" y="124" width="106" height="44" rx="8"/><text class="th" x="95" y="146" text-anchor="middle" dominant-baseline="central">Da valutare</text></g>
<line x1="148" y1="146" x2="161" y2="146" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="163" y="124" width="106" height="44" rx="8"/><text class="th" x="216" y="146" text-anchor="middle" dominant-baseline="central">In mandato</text></g>
<line x1="269" y1="146" x2="282" y2="146" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="284" y="124" width="106" height="44" rx="8"/><text class="th" x="337" y="146" text-anchor="middle" dominant-baseline="central">In vendita</text></g>
<line x1="390" y1="146" x2="403" y2="146" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="405" y="124" width="106" height="44" rx="8"/><text class="th" x="458" y="146" text-anchor="middle" dominant-baseline="central">Trattativa</text></g>
<line x1="511" y1="146" x2="524" y2="146" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="526" y="124" width="106" height="44" rx="8"/><text class="th" x="579" y="146" text-anchor="middle" dominant-baseline="central">Venduto</text></g>

<text class="cap" x="42" y="194">Trattativa: il motore della vendita</text>
<g class="purple"><rect x="42" y="204" width="134" height="50" rx="8"/><text class="th" x="109" y="221" text-anchor="middle" dominant-baseline="central">In trattativa</text><text class="ts" x="109" y="239" text-anchor="middle" dominant-baseline="central">stato di partenza</text></g>
<line x1="176" y1="229" x2="194" y2="229" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="purple"><rect x="196" y="204" width="134" height="50" rx="8"/><text class="th" x="263" y="220" text-anchor="middle" dominant-baseline="central">Preliminare</text><text class="th" x="263" y="238" text-anchor="middle" dominant-baseline="central">firmato</text></g>
<line x1="330" y1="229" x2="348" y2="229" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="purple"><rect x="350" y="204" width="134" height="50" rx="8"/><text class="th" x="417" y="220" text-anchor="middle" dominant-baseline="central">Rogito</text><text class="th" x="417" y="238" text-anchor="middle" dominant-baseline="central">completato</text></g>
<line x1="484" y1="229" x2="502" y2="229" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="purple"><rect x="504" y="204" width="134" height="50" rx="8"/><text class="th" x="571" y="221" text-anchor="middle" dominant-baseline="central">Chiusa</text><text class="ts" x="571" y="239" text-anchor="middle" dominant-baseline="central">pratica finita</text></g>
<line x1="109" y1="254" x2="109" y2="282" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="gray"><rect x="42" y="284" width="204" height="44" rx="8"/><text class="th" x="144" y="306" text-anchor="middle" dominant-baseline="central">Chiusa senza vendita</text></g>
<text class="ts" x="42" y="340" dominant-baseline="central">anche dal preliminare firmato</text>

<path d="M417 254 V344 H300 V370" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#frecciaVerde)"/>
<text class="ts" x="430" y="300" dominant-baseline="central">al rogito nascono 2 righe da sole</text>
<text class="cap" x="190" y="360">Provvigione</text>
<g class="teal"><rect x="190" y="372" width="126" height="44" rx="8"/><text class="th" x="253" y="394" text-anchor="middle" dominant-baseline="central">Da fatturare</text></g>
<line x1="316" y1="394" x2="346" y2="394" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="purple"><rect x="348" y="372" width="126" height="44" rx="8"/><text class="th" x="411" y="394" text-anchor="middle" dominant-baseline="central">Fatturata</text></g>
<line x1="474" y1="394" x2="504" y2="394" class="arr" marker-end="url(#frecciaGrigia)"/>
<g class="purple"><rect x="506" y="372" width="126" height="44" rx="8"/><text class="th" x="569" y="394" text-anchor="middle" dominant-baseline="central">Incassata</text></g>
<text class="ts" x="190" y="438">la fattura la emetti tu; poi porti avanti lo stato</text>

<g class="purple"><rect x="42" y="466" width="14" height="14" rx="3"/></g>
<text class="ts" x="64" y="473" dominant-baseline="central">lo porti avanti tu</text>
<g class="teal"><rect x="232" y="466" width="14" height="14" rx="3"/></g>
<text class="ts" x="254" y="473" dominant-baseline="central">nasce da solo</text>
<g class="gray"><rect x="400" y="466" width="14" height="14" rx="3"/></g>
<text class="ts" x="422" y="473" dominant-baseline="central">stato di un'altra scheda</text>
</g>
</svg>
