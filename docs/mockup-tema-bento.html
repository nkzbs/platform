<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema Bento — Super Admin, Finance, Zucca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  /* ═══════════ TOKEN DEL TEMA ═══════════
     Il tema è questo blocco di variabili: chiaro e scuro, e UN colore fisso per tipo di componente
     (stesso significato in ogni ambiente). L'accento cambia per ambiente/tenant. */
  :root {
    --bg: #f4f1ff; --card: #ffffff; --ink: #231f3b; --ink2: rgba(35,31,59,.62); --line: rgba(35,31,59,.10); --glass: rgba(255,255,255,.66);
    --kpi: #d6efff;       /* numeri e riepiloghi */
    --coda: #e3dcff;      /* code e liste da lavorare (da smistare, tenant, trattative) */
    --attivita: #ffe3d2;  /* attività, agenda, cose da fare oggi */
    --archivio: #d8f4df;  /* archivi, anagrafiche, elenchi di cose a posto */
    --scadenze: #fff0b8;  /* rate, scadenze, provvigioni da incassare */
    --avvisi: #ffd9ea;    /* avvisi, checklist, cose che richiedono attenzione */
    --ok: #bff0cf; --okt: #0d5a32; --att: #ffe08a; --attt: #6b4800; --er: #ffc2cb; --ert: #8c1730;
    --ombra: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 24px rgba(60,50,120,.08);
    --r: 28px; --rs: 18px;
  }
  [data-modo="scuro"] {
    --bg: #0e0d17; --card: #1a1925; --ink: #f1efff; --ink2: rgba(241,239,255,.62); --line: rgba(241,239,255,.10); --glass: rgba(255,255,255,.07);
    --kpi: #153248; --coda: #2a2350; --attivita: #4a2c1d; --archivio: #1b3b29; --scadenze: #473d12; --avvisi: #4a2136;
    --ok: #1f5a39; --okt: #8df0b5; --att: #5c4a10; --attt: #ffd266; --er: #5e2230; --ert: #ff9fb0;
    --ombra: 0 1px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.35);
  }
  [data-app="admin"]   { --acc: #584aec; --accw: #fff; }
  [data-app="finance"] { --acc: #0f9d8a; --accw: #fff; }
  [data-app="zucca"]   { --acc: #2f78d6; --accw: #fff; }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.35; transition: background .25s, color .25s; min-height: 100vh; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.s { width: 15px; height: 15px; }

  /* ── barra del mockup (non fa parte dell'app) ── */
  .mock { position: sticky; top: 0; z-index: 30; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #15141c; color: #fff; overflow-x: auto; font: 600 12px system-ui, sans-serif; }
  .mock .grp { display: flex; gap: 4px; flex: none; padding-right: 10px; border-right: 1px solid #333; }
  .mock .grp:last-child { border: 0; }
  .mock button { padding: 6px 12px; border-radius: 99px; background: #2b2a35; color: #ddd; white-space: nowrap; }
  .mock button[aria-pressed="true"] { background: #fff; color: #111; }
  .mock .et { color: #8a8a99; padding: 0 4px; align-self: center; }

  /* ── guscio dell'app ── */
  .app { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 44px); }
  .rail { display: none; }
  .main { padding: 18px 14px 120px; max-width: 1180px; width: 100%; margin: 0 auto; }
  @media (min-width: 860px) {
    .app { grid-template-columns: 232px 1fr; }
    .rail { display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; position: sticky; top: 44px; height: calc(100vh - 44px); }
    .main { padding: 26px 30px 60px; }
    .dock { display: none !important; }
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .logo b { width: 32px; height: 32px; border-radius: 11px; background: var(--acc); color: var(--accw); display: grid; place-items: center; font-size: 15px; }
  .logo small { display: block; font-weight: 500; font-size: 11px; color: var(--ink2); letter-spacing: 0; }
  .voce { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 16px; color: var(--ink2); font-weight: 500; text-align: left; width: 100%; }
  .voce:hover { background: var(--glass); }
  .voce[aria-current="page"] { background: var(--acc); color: var(--accw); font-weight: 700; box-shadow: 0 6px 18px -6px var(--acc); }
  .rail .sp { flex: 1; }
  .ver { font-size: 11px; color: var(--ink2); padding: 8px 12px; }

  /* dock flottante (solo telefono, come nell'app) */
  .dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 4px; padding: 7px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: var(--ombra); }
  .dock button { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--ink2); }
  .dock button[aria-current="page"] { background: var(--acc); color: var(--accw); box-shadow: 0 6px 16px -4px var(--acc); }

  /* ── testata di pagina ── */
  .pg { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .pg h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .pg p { color: var(--ink2); font-size: 13px; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 18px; border-radius: 999px; background: var(--acc); color: var(--accw); font-weight: 700; box-shadow: 0 8px 20px -8px var(--acc); }
  .btn.sec { background: var(--glass); color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
  .btn.sm { padding: 7px 13px; font-size: 13px; }

  /* ── schede (colore FISSO per componente) ── */
  .gr { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
  .c { grid-column: span 12; background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--ombra); position: relative; }
  @media (min-width: 860px) { .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } }
  @media (min-width: 560px) and (max-width: 859px) { .s3, .s4 { grid-column: span 6; } }
  .c.kpi { background: var(--kpi); } .c.coda { background: var(--coda); } .c.attivita { background: var(--attivita); }
  .c.archivio { background: var(--archivio); } .c.scadenze { background: var(--scadenze); } .c.avvisi { background: var(--avvisi); }
  .ct { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .ct h2 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ct small { color: var(--ink2); font-size: 12px; }
  .gran { font-size: clamp(44px, 10vw, 72px); font-weight: 800; letter-spacing: -.05em; line-height: .95; font-variant-numeric: tabular-nums; }
  .gran small { font-size: .32em; font-weight: 500; opacity: .65; letter-spacing: 0; margin-left: 4px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
  .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kg { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
  .it { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; }
  .it + .it { border-top: 1px solid var(--line); }
  .it .sx { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .it .sx > div { min-width: 0; } .it .sx b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .sx span { font-size: 12px; color: var(--ink2); }
  .av { width: 38px; height: 38px; border-radius: 13px; background: var(--glass); display: grid; place-items: center; font-weight: 700; flex: none; }
  .pl { font-size: 11.5px; padding: 4px 11px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
  .pl.ok { background: var(--ok); color: var(--okt); } .pl.att { background: var(--att); color: var(--attt); } .pl.er { background: var(--er); color: var(--ert); } .pl.n { background: var(--glass); color: var(--ink2); }
  .bar { height: 12px; border-radius: 99px; background: var(--glass); overflow: hidden; margin-top: 9px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--acc); }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .chip { flex: none; min-width: 148px; padding: 12px 14px; border-radius: var(--rs); background: var(--glass); text-align: left; }
  .chip.on { outline: 2.5px solid var(--acc); }
  .chip em { display: block; font-style: normal; font-size: 12px; color: var(--ink2); }
  .chip b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .chip span { font-size: 11px; color: var(--ink2); }
  .rate { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .rata { padding: 12px 14px; border-radius: var(--rs); background: var(--glass); }
  .rata .d { font-size: 11px; color: var(--ink2); } .rata .i { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rata .r { margin-top: 8px; font-size: 11.5px; font-weight: 700; padding: 5px 8px; border-radius: 99px; text-align: center; background: var(--ok); color: var(--okt); }
  .rata .r.no { background: transparent; border: 2px dashed var(--attt); color: var(--attt); }
  .cerchi { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .cerchi i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 12px 'DM Sans'; border: 2.5px solid var(--line); color: var(--ink2); font-style: normal; }
  .cerchi i.f { background: var(--acc); border-color: var(--acc); color: var(--accw); }
  .filtri { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
  .filtri button { flex: none; padding: 8px 15px; border-radius: 99px; background: var(--glass); font-weight: 600; font-size: 13px; border: 1px solid var(--line); }
  .filtri button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .foto { height: 120px; border-radius: 20px; margin-bottom: 12px; background: linear-gradient(135deg, var(--acc), #ffb36b); position: relative; overflow: hidden; }
  .foto::after { content: ''; position: absolute; inset: auto -10% -30% -10%; height: 70%; background: rgba(255,255,255,.22); border-radius: 50% 50% 0 0; }
  .pipe { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .pipe { grid-template-columns: repeat(4, 1fr); } }
  .col h3 { font-size: 13px; margin: 0 4px 9px; display: flex; justify-content: space-between; }
  .kb { background: var(--card); border-radius: var(--rs); padding: 13px; margin-bottom: 9px; box-shadow: var(--ombra); }
  .kb b { display: block; font-size: 14px; } .kb span { font-size: 12px; color: var(--ink2); }
  .cart { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .cart div { background: var(--glass); border-radius: var(--rs); padding: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
  .cart small { font-weight: 500; color: var(--ink2); font-size: 12px; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--glass); margin-bottom: 14px; }
  .tabs button { padding: 8px 18px; border-radius: 99px; font-weight: 600; color: var(--ink2); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--ombra); }
  .opz { display: flex; gap: 12px; flex-wrap: wrap; }
  .opz .o { flex: 1 1 160px; border-radius: var(--rs); border: 2px solid var(--line); padding: 14px; background: var(--glass); }
  .opz .o.on { border-color: var(--acc); }
  .sw { display: flex; gap: 8px; margin-top: 8px; } .sw i { width: 26px; height: 26px; border-radius: 50%; }
  .velo { position: fixed; inset: 0; z-index: 40; background: rgba(10,8,20,.5); display: grid; place-items: center; padding: 16px; }
  .vet { background: var(--card); border-radius: 28px; width: 100%; max-width: 420px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .vet h3 { font-size: 19px; margin-bottom: 2px; }
  .legenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .legenda div { border-radius: var(--rs); padding: 12px 14px; font-size: 13px; }
  .legenda b { display: block; margin-bottom: 2px; }
  .nota { font-size: 11px; color: var(--ink2); margin-top: 24px; max-width: 700px; }
</style>
</head>
<body data-app="finance" data-modo="chiaro">
<div class="mock" role="toolbar" aria-label="Controlli del mockup">
  <span class="et">Ambiente</span>
  <div class="grp" id="gApp"></div>
  <span class="et">Modo</span>
  <div class="grp" id="gModo"></div>
  <span class="et">Schermata</span>
  <div class="grp" id="gPag"></div>
</div>
<div class="app">
  <nav class="rail" id="rail" aria-label="Menu"></nav>
  <main class="main" id="main"></main>
</div>
<nav class="dock" id="dock" aria-label="Menu"></nav>
<div id="velo"></div>

<script>
/* ═══════════ icone ═══════════ */
var P = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  building: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/>',

  sliders: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',

  plus: '<path d="M12 5v14M5 12h14"/>',

  scale: '<path d="M12 3v18M5 21h14M5 7h14"/><path d="M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',

};
function ic(n, s) { return '<svg class="i' + (s ? ' s' : '') + '" viewBox="0 0 24 24">' + (P[n] || '') + '</svg>'; }
function pl(t, k) { return '<span class="pl ' + (k || 'n') + '">' + t + '</span>'; }

/* ═══════════ schermate ═══════════ */
var A = {};

/* ───────── SUPER ADMIN ───────── */
A.admin = { nome: 'Platform', sub: 'Super Admin', ver: '0.5.65', logo: 'P',
  menu: [['dash', 'Dashboard', 'home'], ['tenant', 'Tenant', 'building'], ['lib', 'Libreria', 'store'], ['att', 'Attività', 'activity'], ['imp', 'Impostazioni', 'sliders']],
  pagine: {
    dash: { t: 'Dashboard', s: 'Benvenuto, Admin', h: function () { return '' +
      '<div class="gr">' +
      '<section class="c kpi s4"><div class="ct"><h2>' + ic('building', 1) + ' Tenant</h2><small>attivi</small></div><div class="gran">2<small>su 2</small></div><div class="lbl" style="margin-top:8px">zucca · Finance</div></section>' +

    tenant: { t: 'Tenant', s: '2 attivi su 2 totali', az: '<button class="btn" onclick="velo()">' + ic('plus', 1) + ' Nuovo tenant</button>', h: function () { return '' +
      '<div class="filtri"><button class="on">Tutti</button><button>Attivi</button><button>Fermi</button></div>' +
      '<div class="gr">' +
      '<section class="c coda s6"><div class="ct"><h2>zucca</h2>' + pl('Linode · 203.0.113.10', 'n') + '</div><div class="lbl">zucca.platform-core.it · :4007</div><div style="display:flex;gap:8px;margin:12px 0">' + pl('Attivo', 'ok') + pl('10 moduli', 'n') + pl('0.5.60', 'att') + '</div><div style="display:flex;gap:8px"><button class="btn sm">Apri</button><button class="btn sm sec">Dettagli</button><button class="btn sm sec" onclick="velo()">Aggiorna</button></div></section>' +

      '</div><p class="nota">Tocca «Aggiorna» per vedere la finestra con la barra di avanzamento (si può ridurre a una pastiglia).</p>'; } },
    lib: { t: 'Libreria', s: 'Moduli e pacchetti', h: function () { return '<div class="gr">' +
